name: MLflow CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas scikit-learn

      - name: Run MLflow Project
        run: |
          # Mengeksekusi folder MLProject
          mlflow run MLProject/ --env-manager=local

      - name: Get Exact Model Path
        id: get_model_path
        run: |
          # Perintah ini akan mencari lokasi pasti dari folder 'model' yang dihasilkan
          # sehingga kebal terhadap masalah parent/child run di MLflow
          MODEL_DIR=$(find mlruns -name "model" -type d | head -n 1)
          echo "Direktori model ditemukan di: $MODEL_DIR"

          # Menyimpan path tersebut sebagai variabel environment
          echo "MODEL_DIR=$MODEL_DIR" >> $GITHUB_ENV

      - name: Upload Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: ${{ env.MODEL_DIR }}

      - name: Build Docker Model
        run: |
          # Menggunakan variabel path model yang sudah pasti akurat
          mlflow models build-docker -m ${{ env.MODEL_DIR }} -n ${{ secrets.DOCKER_USERNAME }}/academic-model:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/academic-model:latest
